version: "3.8"
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-knowledge_center}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=caching_sha2_password --ngram-token-size=2
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/server
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-admin}:${MYSQL_PASSWORD:-password}@db:3306/${MYSQL_DATABASE:-knowledge_center}?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    profiles: ["full"]

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    profiles: ["full"]

volumes:
  mysql_data:
  uploads_data:
